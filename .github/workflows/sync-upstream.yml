name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git || true
          git fetch upstream main

      - name: Merge and push
        env:
          # GITHUB_TOKEN 沒有 `workflows` 權限，push 含 .github/workflows/* 的合併會被拒：
          #   remote rejected ... without `workflows` permission
          # 因此改用帶 repo+workflow scope 的 PAT（secret: SYNC_TOKEN）。
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
